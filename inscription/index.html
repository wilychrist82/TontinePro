<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#F5F6FA]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | Tontine Pro</title>
    <!-- Tailwind CSS via CDN pour l'intégration sans build -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0B1F4D',
                        'navy-light': '#1A336D',
                        yellow: '#F5B301',
                        'yellow-hover': '#E5A700',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Polices -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Icônes Lucide/Feather équivalent -->
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="h-full font-sans antialiased text-slate-800 flex flex-col">

    <!-- HEADER MINIMALISTE -->
    <nav class="w-full absolute top-0 z-50 p-6">
        <div class="max-w-7xl mx-auto flex justify-center md:justify-start">
            <a href="../../index.html" class="flex items-center gap-2 text-navy hover:opacity-80 transition-opacity">
                <div class="bg-navy p-2 rounded-xl">
                    <i data-feather="users" class="text-yellow w-5 h-5"></i>
                </div>
                <span class="text-xl font-heading font-bold tracking-tight">Tontine Pro</span>
            </a>
        </div>
    </nav>

    <!-- ZONE D'INSCRIPTION -->
    <div class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-100 p-8 md:p-10 relative overflow-hidden mt-16 md:mt-0">
            <!-- Décoration fond -->
            <div class="absolute -top-20 -right-20 w-40 h-40 bg-yellow/10 rounded-full blur-3xl z-0"></div>
            
            <div class="relative z-10">
                <h1 class="text-2xl font-heading font-bold text-navy mb-2 text-center">Créer un compte</h1>
                <p class="text-slate-500 text-sm mb-8 text-center">Rejoignez Tontine Pro et gérez vos cercles d'épargne en toute sécurité.</p>

                <form id="register-form" class="space-y-5">
                    
                    <div>
                        <label for="fullname" class="block text-sm font-semibold text-slate-700 mb-1.5">Nom complet</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-feather="user" class="h-5 w-5 text-slate-400"></i>
                            </div>
                            <input type="text" id="fullname" name="fullname" required 
                                class="block w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-navy focus:border-navy transition-colors" 
                                placeholder="Jean Dupont">
                        </div>
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-semibold text-slate-700 mb-1.5">Adresse e-mail</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-feather="mail" class="h-5 w-5 text-slate-400"></i>
                            </div>
                            <input type="email" id="email" name="email" required 
                                class="block w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-navy focus:border-navy transition-colors" 
                                placeholder="vous@exemple.com">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Mot de passe</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-feather="lock" class="h-5 w-5 text-slate-400"></i>
                            </div>
                            <input type="password" id="password" name="password" required 
                                class="block w-full pl-11 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-navy focus:border-navy transition-colors" 
                                placeholder="••••••••">
                            <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                                <i data-feather="eye" class="h-4 w-4"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label for="password-confirm" class="block text-sm font-semibold text-slate-700 mb-1.5">Confirmer le mot de passe</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-feather="check-circle" class="h-5 w-5 text-slate-400"></i>
                            </div>
                            <input type="password" id="password-confirm" name="password-confirm" required 
                                class="block w-full pl-11 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-navy focus:border-navy transition-colors" 
                                placeholder="••••••••">
                        </div>
                        <p id="password-error" class="text-red-500 text-xs mt-1 hidden">Les mots de passe ne correspondent pas.</p>
                    </div>

                    <div class="flex items-start mt-4 mb-6">
                        <input id="terms" name="terms" type="checkbox" required class="mt-1 h-4 w-4 text-navy focus:ring-navy border-slate-300 rounded cursor-pointer">
                        <label for="terms" class="ml-2 block text-xs text-slate-600 cursor-pointer">
                            J'accepte les <a href="../conditions.html" class="text-navy font-semibold hover:underline">conditions d'utilisation</a> et la <a href="../confidentialite.html" class="text-navy font-semibold hover:underline">politique de confidentialité</a>.
                        </label>
                    </div>

                    <div>
                        <button type="submit" class="w-full bg-navy hover:bg-navy-light text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-lg hover:shadow-xl hover:-translate-y-0.5 flex justify-center items-center gap-2 group">
                            Créer mon compte <i data-feather="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                        </button>
                    </div>
                </form>

                <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                    <p class="text-sm text-slate-600">
                        Vous avez déjà un compte ? 
                        <a href="/connexion/index.html" class="font-bold text-navy hover:text-yellow transition-colors ml-1">Se connecter</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER MINIMALISTE -->
    <footer class="py-6 text-center text-xs text-slate-400">
        <p>© 2026 Tontine Pro. Sécurisé par Supabase.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../config.js"></script>
    <script>
        feather.replace();

        // Initialisation Supabase
        const supabaseUrl = window.ENV.NEXT_PUBLIC_SUPABASE_URL;
        const supabaseKey = window.ENV.NEXT_PUBLIC_SUPABASE_ANON_KEY;
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const registerForm = document.getElementById('register-form');
        const submitBtn = registerForm.querySelector('button[type="submit"]');
        const errorText = document.getElementById('password-error');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullname = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('password-confirm').value;

            // Vérification des mots de passe
            if (password !== confirmPassword) {
                errorText.classList.remove('hidden');
                return;
            }
            errorText.classList.add('hidden');

            // Bouton en chargement
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i data-feather="loader" class="w-5 h-5 animate-spin"></i> Création...';
            feather.replace();
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        full_name: fullname
                    }
                }
            });

            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            submitBtn.innerHTML = originalBtnText;

            if (error) {
                alert("Erreur d'inscription : " + error.message);
            } else {
                const userEmailLower = (email || '').trim().toLowerCase();
                localStorage.setItem('tontine_user_pwd_' + userEmailLower, password);
                localStorage.setItem('tontine_user_pwd_general', password);

                if (data.user) {
                    await supabaseClient.from('profiles').insert([{ 
                        id: data.user.id, 
                        full_name: fullname 
                    }]);
                }
                
                if (data.session) {
                    window.location.href = '/dashboard.html';
                } else {
                    alert("Inscription réussie ! Veuillez vérifier votre boîte mail pour confirmer votre compte, puis connectez-vous.");
                    window.location.href = '/connexion/index.html';
                }
            }
        });

        // Afficher/Masquer le mot de passe
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.innerHTML = type === 'password' ? '<i data-feather="eye" class="h-4 w-4"></i>' : '<i data-feather="eye-off" class="h-4 w-4"></i>';
            feather.replace();
        });
    </script>
</body>
</html>
