<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#F5F6FA]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau mot de passe | Tontine Pro</title>
    <!-- Tailwind CSS via CDN pour l'intégration sans build -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0B1F4D',
                        'navy-light': '#1A336D',
                        yellow: '#F5B301',
                        'yellow-hover': '#E5A700',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Polices -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Icônes Lucide/Feather équivalent -->
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config.js"></script>
</head>
<body class="h-full font-sans antialiased text-slate-800 flex flex-col">

    <!-- HEADER MINIMALISTE -->
    <nav class="w-full absolute top-0 z-50 p-6">
        <div class="max-w-7xl mx-auto flex justify-center md:justify-start">
            <a href="../index.html" class="flex items-center gap-2 text-navy hover:opacity-80 transition-opacity">
                <div class="bg-navy p-2 rounded-xl">
                    <i data-feather="users" class="text-yellow w-5 h-5"></i>
                </div>
                <span class="text-xl font-heading font-bold tracking-tight">Tontine Pro</span>
            </a>
        </div>
    </nav>

    <!-- ZONE DE RÉINITIALISATION -->
    <div class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-100 p-8 md:p-10 relative overflow-hidden">
            <!-- Décoration fond -->
            <div class="absolute -top-20 -right-20 w-40 h-40 bg-yellow/10 rounded-full blur-3xl z-0"></div>
            
            <div class="relative z-10">
                <div class="w-12 h-12 bg-navy/5 text-navy rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i data-feather="lock" class="w-6 h-6"></i>
                </div>
                <h1 class="text-2xl font-heading font-bold text-navy mb-2 text-center">Nouveau mot de passe</h1>
                <p class="text-slate-500 text-sm mb-8 text-center">Créez un nouveau mot de passe sécurisé pour votre compte Tontine Pro afin de vous reconnecter.</p>

                <form id="reset-form" class="space-y-6">
                    <div>
                        <label for="new-pwd" class="block text-sm font-semibold text-slate-700 mb-2">Nouveau mot de passe</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                <i data-feather="key" class="w-5 h-5"></i>
                            </div>
                            <input type="password" id="new-pwd" required minlength="4" 
                                class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-navy focus:border-navy text-sm transition-all outline-none" 
                                placeholder="••••••••">
                        </div>
                    </div>

                    <div>
                        <label for="confirm-pwd" class="block text-sm font-semibold text-slate-700 mb-2">Confirmer le nouveau mot de passe</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                <i data-feather="check-circle" class="w-5 h-5"></i>
                            </div>
                            <input type="password" id="confirm-pwd" required minlength="4" 
                                class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-navy focus:border-navy text-sm transition-all outline-none" 
                                placeholder="••••••••">
                        </div>
                        <p id="pwd-error" class="text-red-500 text-xs mt-2 hidden">Les mots de passe ne correspondent pas.</p>
                    </div>

                    <button type="submit" 
                        class="w-full py-3.5 px-4 bg-navy hover:bg-navy-light text-white font-semibold rounded-xl shadow-lg shadow-navy/20 hover:shadow-navy/30 focus:ring-4 focus:ring-navy/20 transition-all flex items-center justify-center gap-2">
                        <span>Enregistrer mon mot de passe</span>
                        <i data-feather="arrow-right" class="w-4 h-4"></i>
                    </button>
                </form>

                <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                    <p class="text-xs text-slate-500">
                        Vous vous souvenez de votre mot de passe ? 
                        <a href="/connexion/index.html" class="font-semibold text-navy hover:underline">Retour à la connexion</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        feather.replace();

        // Initialisation Supabase
        const supabaseUrl = window.ENV.NEXT_PUBLIC_SUPABASE_URL;
        const supabaseKey = window.ENV.NEXT_PUBLIC_SUPABASE_ANON_KEY;
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const resetForm = document.getElementById('reset-form');
        const submitBtn = resetForm.querySelector('button[type="submit"]');
        const errorEl = document.getElementById('pwd-error');

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.classList.add('hidden');

            const p1 = document.getElementById('new-pwd').value;
            const p2 = document.getElementById('confirm-pwd').value;

            if (p1 !== p2) {
                errorEl.textContent = "Les mots de passe ne correspondent pas.";
                errorEl.classList.remove('hidden');
                return;
            }

            if (p1.length < 4) {
                errorEl.textContent = "Le mot de passe doit comporter au moins 4 caractères.";
                errorEl.classList.remove('hidden');
                return;
            }

            // Button en chargement
            const origText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i data-feather="loader" class="w-5 h-5 animate-spin"></i> Enregistrement...';
            feather.replace();
            submitBtn.disabled = true;

            // Récupérer l'e-mail depuis l'URL ou le dernier login
            const urlParams = new URLSearchParams(window.location.search);
            const emailParam = urlParams.get('email') || localStorage.getItem('tontine_last_login_email') || 'user@tontine.pro';
            const userEmail = emailParam.trim().toLowerCase();

            // Mettre à jour dans localStorage pour TOUS les comptes en cache
            localStorage.setItem('tontine_user_pwd_' + userEmail, p1);
            localStorage.setItem('tontine_user_pwd_general', p1);
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.startsWith('tontine_user_pwd_')) {
                    localStorage.setItem(k, p1);
                }
            }

            // Mettre à jour sur Supabase Auth s'il y a une session active ou de récupération
            try {
                const { data, error } = await supabaseClient.auth.updateUser({ password: p1 });
                if (error) {
                    console.warn("Supabase update pwd:", error.message);
                }
            } catch (err) {
                console.warn("Err Supabase:", err);
            }

            // Message de succès
            alert("✅ Votre nouveau mot de passe a été créé et enregistré avec succès ! Vous pouvez maintenant vous connecter.");
            window.location.href = '/connexion/index.html';
        });
    </script>
</body>
</html>
